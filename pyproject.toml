[project]
name = "site-ripper"
version = "0.1.0"
description = "Paste a link, get a polite offline copy of a website or a public cloud bucket."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.15.0",
    "defusedxml==0.7.1",
    "flask==3.1.3",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
    "types-defusedxml==0.7.0.20260504",
]

[project.scripts]
site-ripper = "site_ripper.cli:main"
site-ripper-web = "site_ripper.web:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
site_ripper = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["bs4.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
